[project]
name = "clearledger"
version = "0.1.0"
description = "Evidence-first payment settlement controller"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "alembic",
    "fastapi",
    "httpx",
    "openai>=1.0",
    "orjson",
    "psycopg[binary]",
    "pydantic",
    "pydantic-settings",
    "python-multipart",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "hypothesis",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
]

[tool.ruff]
extend-exclude = ["prompts/phase-*.md", "db/migrations/versions"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["apps/api/tests", "evaluator/tests", "generator/tests", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
